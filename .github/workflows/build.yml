# Builds OctoWoW Manager as standalone programs (no installers):
#   Windows: single .exe · Linux: single .AppImage · macOS: universal .app (zipped)
# Runs on every push to main and from the Actions tab ("Run workflow"); results are
# attached to the run as artifacts. Pushing a tag like v3.0.0 also attaches them to
# a draft GitHub release.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Unit tests
        run: cd src-tauri && cargo test --lib

      - name: Build (Windows .exe)
        if: runner.os == 'Windows'
        run: npx tauri build --no-bundle

      - name: Build (Linux .AppImage)
        if: runner.os == 'Linux'
        run: npx tauri build --bundles appimage

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Collect into releases/
        run: |
          mkdir -p releases
          V=$(node -p "require('./package.json').version")
          case "$RUNNER_OS" in
            Windows) cp src-tauri/target/release/octowow-manager.exe "releases/OctoWoW_Manager_v${V}_windows_x64.exe" ;;
            Linux)   cp src-tauri/target/release/bundle/appimage/*.AppImage "releases/OctoWoW_Manager_v${V}_linux_x64.AppImage" ;;
            macOS)   ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/OctoWoW Manager.app" "releases/OctoWoW_Manager_v${V}_macos_universal.zip" ;;
          esac
          ls -la releases

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: releases/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: builds/*
