[package]
name = "octowow-manager"
version = "3.0.0"
description = "OctoWoW Manager"
edition = "2021"

[lib]
name = "octowow_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha1 = "0.10"
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"
include_dir = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }
mslnk = "0.1"
